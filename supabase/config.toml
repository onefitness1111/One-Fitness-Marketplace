# Gateway checks for functions in this repo. Anything not listed keeps the
# Supabase default, which requires a signed-in caller.

[functions.calendar-feed]
verify_jwt = false

[functions.get-calendar-link]
verify_jwt = true

[functions.save-coach-unavailability]
verify_jwt = true

# Plate photos and Quick add macro estimates. Signed-in callers only.
[functions.estimate-plate]
verify_jwt = true

# The gateway would reject the cron call, which has no user token. The
# function itself checks the Vault cron secret, and an owner token.
[functions.rollover-membership-sessions]
verify_jwt = false

# The database calls this with pg_net and does not send a JWT.
# The function trusts only a message id and re-reads with the service key.
[functions.chat-auto-reply-sms]
verify_jwt = false

# Twilio posts here with no JWT. The function checks Twilio's signature.
[functions.sms-inbound]
verify_jwt = false

# Same inbound handler as sms-inbound. The business number may use either URL.
[functions.twilio-inbound]
verify_jwt = false

# Owner asks non-consented clients, by push only, to open the SMS opt-in.
[functions.prompt-sms-opt-in]
verify_jwt = true

# Stripe posts here with no JWT. The function checks Stripe's signature.
[functions.stripe-webhook]
verify_jwt = false

# Twilio delivery reports. Twilio sends no JWT; the function checks
# X-Twilio-Signature. Only called once TWILIO_STATUS_CALLBACK_URL is set.
[functions.twilio-status]
verify_jwt = false

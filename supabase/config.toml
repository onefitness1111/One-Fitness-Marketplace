# Gateway checks for functions in this repo. Anything not listed keeps the
# Supabase default, which requires a signed-in caller.

[functions.calendar-feed]
verify_jwt = false

[functions.get-calendar-link]
verify_jwt = true

[functions.save-coach-unavailability]
verify_jwt = true

# Plate photos and Quick add macro estimates. Signed-in callers only.
[functions.estimate-plate]
verify_jwt = true

# Owner asks non-consented clients, by push only, to open the SMS opt-in.
[functions.prompt-sms-opt-in]
verify_jwt = true
